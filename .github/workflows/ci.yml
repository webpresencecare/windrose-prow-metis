# Checks every push to main and every pull request: php -l on PHP 8.4 and 8.5, core's theme.json schema accepts
# theme.json and every style variation, the theme header has what WordPress needs, Metis on GitHub still has the names
# and the switch this theme stands on, and the release zip builds. PHPCS, PHPStan and Playwright run locally only
# (Playwright needs a WordPress network). A green tick before tagging a release.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l on every PHP file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -print0)
          exit $status

  theme:
    name: Theme files, Metis's names and zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: theme.json and style variations against core's theme.json schema
        run: |
          curl -sSfL -o /tmp/schema.json https://schemas.wp.org/trunk/theme.json
          npx --yes -p ajv-cli@5.0.0 -p ajv-formats@3.0.1 ajv validate --spec=draft7 --strict=false -c ajv-formats -s /tmp/schema.json -d 'theme.json' -d 'styles/*.json'
      - name: Theme header
        run: |
          for field in 'Theme Name' 'Template' 'Version' 'Requires at least' 'Requires PHP' 'Text Domain' 'Update URI'; do
            grep -q "^$field: ." style.css || { echo "::error::style.css has no $field header."; exit 1; }
          done
          grep -q '^Template: metis$' style.css
      - name: Metis still has the names and the switch this theme stands on
        run: node bin/check-metis.mjs --remote
      - name: Build the zip
        run: bash bin/build-zip.sh
